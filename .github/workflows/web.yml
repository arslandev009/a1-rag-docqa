name: web

on:
  push:
    paths: ["web/**"]
  pull_request:
    paths: ["web/**"]

jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Gateway tests (no network, no dependencies)
        run: node --test