[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docqa"
version = "0.3.0"
description = "Production-style RAG assistant with hybrid search, versioned sources, access control, an eval harness and an HTTP API"
requires-python = ">=3.11"
# NOTE: also needs the local package `llm-client` (pip install -e ../../packages/llm-client).
dependencies = [
  "pyyaml>=6",
  "python-dotenv>=1.0",
  "openai>=1.40",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.115", "ruff>=0.6"]

[project.scripts]
docqa = "docqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
